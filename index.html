<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0c0f">
<meta name="color-scheme" content="dark">
<meta name="description" content="Nhật ký tập gym offline: ghi hiệp, đồng hồ nghỉ, PR, tiến bộ, xuất CSV.">
<title>Gym Log</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app"></div>
<div id="page-root"></div>
<nav class="nav" id="nav"><div class="nav-in">
  <button data-act="tab" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>Hôm nay</button>
  <button data-act="tab" data-tab="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Lịch sử</button>
  <button data-act="tab" data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19l5-6 4 3 7-9"/><path d="M15 7h5v5"/></svg>Tiến bộ</button>
  <button data-act="tab" data-tab="library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 4h4v16H5zM10 4h4v16h-4zM15.5 5l3.5-.9 3 15.5-3.6.8z"/></svg>Bài & giáo án</button>
</div></nav>
<div id="rest-root"></div>
<div id="toast-root"></div>
<input type="file" id="importFile" accept="application/json,.json" class="hidden">
<script src="js/logic.js"></script>
<script src="js/seed.js"></script>
<script src="js/store.js"></script>
<script src="js/coach.js"></script>
<script src="js/health.js"></script>
<script src="js/app.js"></script>
</body>
</html>
