name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'privacypolicy.html'
      - 'css/**'
      - 'js/**'
      - 'img/**'
      - 'icons/**'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install and test
        run: |
          npm ci
          npm test

      - name: Build web assets and sync Capacitor
        run: |
          node scripts/build-www.js
          npx cap sync android

      - name: Build signed release APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          export KEYSTORE_FILE="$RUNNER_TEMP/release.p12"
          export VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))
          export VERSION_NAME="$(node -p "require('./package.json').version").${GITHUB_RUN_NUMBER}"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/GymLog.apk"
          rm -f "$RUNNER_TEMP/release.p12"

      - name: Verify signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs GymLog.apk | head -5

      - uses: actions/upload-artifact@v4
        with:
          name: GymLog-${{ env.VERSION_NAME }}
          path: GymLog.apk

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION_NAME}" GymLog.apk --latest \
            --title "Gym Log ${VERSION_NAME}" \
            --notes "Android build ${VERSION_NAME} from ${GITHUB_SHA::7}. Install: download GymLog.apk on the phone and open it."
